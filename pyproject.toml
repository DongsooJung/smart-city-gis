[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcity-gis"
dynamic = ["version"]
description = "GIS-based urban analytics for smart city planning: walkability, 2SFCA accessibility, isochrones and 15-minute city scores for Korean cities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Dongsoo Jung", email = "jds068888@gmail.com" },
]
keywords = [
    "gis",
    "walkability",
    "2sfca",
    "accessibility",
    "15-minute-city",
    "urban-analytics",
    "smart-city",
    "korea",
    "geopandas",
    "osmnx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
# Runtime core deps kept minimal for a light install.
# Note: scipy is required (accessibility.py uses scipy.spatial.distance.cdist)
# but was missing from requirements.txt -- fixed here.
dependencies = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "networkx>=3.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
network = [
    "osmnx>=1.7.0",
    "pandana>=0.7",
]
viz = [
    "matplotlib>=3.8.0",
    "folium>=0.15.0",
    "contextily>=1.4.0",
    "plotly>=5.18.0",
]
stats = [
    "libpysal>=4.8.0",
    "esda>=2.5.0",
    "pointpats>=2.4.0",
    "rasterio>=1.3.0",
    "fiona>=1.9.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
    "nbformat>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/DongsooJung/smart-city-gis"
Repository = "https://github.com/DongsooJung/smart-city-gis"
Issues = "https://github.com/DongsooJung/smart-city-gis/issues"
Changelog = "https://github.com/DongsooJung/smart-city-gis/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "smartcity_gis.__version__" }
