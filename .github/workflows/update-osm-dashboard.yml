name: Refresh OSM dashboard data

on:
  schedule:
    - cron: "17 19 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard dependencies
        run: pip install "numpy>=1.26" "networkx>=3.2" "geopandas>=0.14" "scipy>=1.11"

      - name: Fetch OpenStreetMap snapshot
        run: python scripts/fetch_osm_data.py

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actual docs/dashboard/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "data: refresh OSM dashboard snapshot"
          git push
