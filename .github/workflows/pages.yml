name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published dashboard
        shell: bash
        run: |
          base_url="${{ steps.deployment.outputs.page_url }}"
          dashboard_file="$RUNNER_TEMP/smart-city-dashboard.html"
          curl --fail --location --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base_url" --output /dev/null
          curl --fail --location --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${base_url%/}/dashboard/" --output "$dashboard_file"
          grep -Fq "강남구 보행성 · 15분도시 대시보드" "$dashboard_file"
